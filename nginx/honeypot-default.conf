# ==============================================================================
# Nginx Default Server Block: Route All Non-Matching Traffic to Honeypot
# Place this in /etc/nginx/conf.d/00-honeypot-default.conf or replace default
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    # Default SSL cert (use your existing fallback cert, self-signed, or snakeoil)
    # Ubuntu/Debian default:
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    # Forward all unmapped requests / random IP scans directly to MSuite Honeypot
    location / {
        proxy_pass http://127.0.0.1:8080; # Replace with Honeypot IP if in LXC
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
        proxy_connect_timeout 3s;
    }
}
