# ==============================================================================
# MSuite Honeypot Trap Rules for Existing Domains
# Include this snippet inside existing server { ... } blocks to instantly ban
# bots fishing for .env, .git, wp-login, etc. on your legitimate sites:
# Example: include /etc/nginx/snippets/honeypot-traps.conf;
# ==============================================================================

location ~* ^/(\.env|\.git|\.aws|\.docker|wp-login\.php|wp-admin|phpmyadmin|pma|actuator|xmlrpc\.php|boaform|setup\.cgi|solr|autodiscover|\.vscode|\.well-known/security\.txt) {
    proxy_pass http://127.0.0.1:8080; # Replace with Honeypot IP if in LXC
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
